{% extends "base.html" %}

{% block content %}
<h2>Add Workout Entry</h2>

<form method="POST">
    <select name="exercise_id" required>
        {% for exercise in exercises %}
            <option value="{{ exercise.exercise_id }}">
                {{ exercise.exercise_name }}
            </option>
        {% endfor %}
    </select>

    <input type="number" name="set_number" placeholder="Set number" required>
    <input type="number" name="reps" placeholder="Reps" required>
    <input type="number" step="0.01" name="weight" placeholder="Weight" required>
    <input type="number" name="rest_seconds" placeholder="Rest seconds">

    <button type="submit">Add Entry</button>
</form>
{% endblock %}
